[tool.poetry]
name = "kindle-vocab-learner"
version = "0.1.0"
description = "A spaced repetition learning tool for Kindle Vocabulary Builder"
authors = ["dev"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["standard"], version = "^0.115.0"}
uvicorn = {extras = ["standard"], version = "^0.30.0"}
jinja2 = "^3.1.0"
python-multipart = "^0.0.9"
aiosqlite = "^0.20.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
